[package]
name = "rust_backend"
version = "0.6.1"
edition = "2024"
authors = ["王郁 <wangyu@wycode.cn>"]

[dependencies]
axum = "0.8"
tower = { version = "0.5", features = ["make"] }
tower-http = { version = "0.6", features = ["fs", "trace", "catch-panic", "normalize-path"] }
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lettre = { version = "0.10", default-features = false, features = [
    "smtp-transport",
    "builder",
    "tokio1",
    "tokio1-native-tls",
    "native-tls",
] }
lettre_email = "0.9"
dotenv = "0.15"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
reqwest = { version = "0.13", features = ["json", "stream", "blocking"] }
chrono = "0.4"
sqlx = { version = "0.8", features = [
    "sqlite",
    "runtime-tokio-native-tls",
    "macros",
    "chrono",
] }
regex = "1"
lazy_static = "1"
rand = "0.10"
sha2 = "0.11.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
serde_yaml = "0.9.34"
glob = "0.3.3"
file-id = "0.2.3"
tokio-stream = "0.1.18"
tokio-util = { version = "0.7.18", features = ["io", "codec"] }
futures = "0.3.32"
